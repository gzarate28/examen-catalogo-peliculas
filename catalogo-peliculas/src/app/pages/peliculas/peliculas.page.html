<ion-header>
  <ion-toolbar>
    <ion-title>Películas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    @for (pelicula of peliculas; track pelicula.id) {

      <ion-card>

        <img
          [src]="pelicula.imagen"
          [alt]="pelicula.titulo"
          class="poster"
        />

        <ion-card-header>
          <ion-card-title>
            {{ pelicula.titulo }}
          </ion-card-title>
        </ion-card-header>

        <ion-card-content>

          <ion-item>
            <ion-label>
              <strong>ID:</strong> {{ pelicula.id }}
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              <strong>Género:</strong> {{ pelicula.genero }}
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              <strong>Año:</strong> {{ pelicula.anio }}
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              <strong>Duración:</strong> {{ pelicula.duracion }} min
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              <strong>Estado:</strong>

              @if (pelicula.disponible) {
                <ion-badge color="success">
                  Disponible
                </ion-badge>
              } @else {
                <ion-badge color="danger">
                  No disponible
                </ion-badge>
              }

            </ion-label>
          </ion-item>

          <ion-button
            expand="block"
            [disabled]="false"
            (click)="verDetalle(pelicula.id)">
            Ver detalle
          </ion-button>

        </ion-card-content>

      </ion-card>

    }

  </ion-list>

</ion-content>
